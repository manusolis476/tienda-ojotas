<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - ingresar</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-box">
    <p class="store-name" style="font-size:1.4rem;">Panel de admin</p>
    <p class="error" id="error" style="display:none;"></p>
    <form id="loginForm">
      <input type="text" id="user" placeholder="Usuario" autocomplete="username" required>
      <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button class="btn btn-pay" type="submit" style="width:100%;">Ingresar</button>
    </form>
  </div>
  <script src="/js/admin-login.js"></script>
</body>
</html>
